{% extends "layout.html" %}

{% block title %}
    Upload
{% endblock %}

{% block body %}
    <div></div>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <label for="file">Select a new profile picture:</label>
        <input type="file" id="file" name="file" accept="image/*">
        <button type="submit">Upload</button>
    </form>
{% endblock %}
