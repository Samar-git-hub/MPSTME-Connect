<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="/static/favicon.jpg" rel="icon">
        <link href="/static/styles.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <title>MPSTME Connect {% block title %}{% endblock %}</title>
    </head>
    <body>
        <header>
            <div class="left-part">
                <a href="/">
                    <img src="/static/logo.svg" class="navimage">
                </a>
            </div>
            <div class="right-part">
                {% if session["user_id"] %}
                    <div class="navbar-tabs"><a href="/search">Search</a></div>
                    <div class="navbar-tabs"><a href="/events">Events</a></div>
                    <div class="navbar-tabs"><a href="/profile">Profile</a></div>
                    <div class="navbar-tabs"><a href="/logout">Log out</a></div>
                {% else %}
                    <div class="navbar-tabs"><a href="/register">Register</a></div>
                    <div class="navbar-tabs"><a href="/login">Log in</a></div>
                {% endif %}
            </div>
        </header>
        {% block body %}{% endblock %}
    </body>
</html>
