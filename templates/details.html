{% extends "layout.html" %}

{% block title %}
    Details
{% endblock %}

{% block body %}
<div class="main-details-container">
    <div class="primary-container-details">
        <div class="header-font" id="register-header">Edit your details</div>
        <div class="layers">
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label for="file">Select a new profile picture:</label>
            <input type="file" id="file" name="file" accept="image/*">
            <button type="submit">Upload</button>
        </form>
        <div class="subheader-font" id="register-subheader">Bio</div>
        <form method="POST" action="/details">
            <input type="hidden" name="form_type" value="bio"> 
            <textarea name="bio" id="bio" required></textarea>
            <button class="submit-button-details" type="submit" >Save</button>
        </form>
        </div>
        <div class="layers">
        <div class="subheader-font" id="register-subheader">Skills</div>
        <form method="POST" action="/details">
            <input type="hidden" name="form_type" value="skills">
            <textarea name="skills" id="skills" required></textarea>
            <button class="submit-button-details" type="submit" >Save</button>
        </form>
        <div class="subheader-font" id="register-subheader">Projects</div>
        <form method="POST" action="/details">
            <input type="hidden" name="form_type" value="projects">
            <textarea name="projects" id="projects" required></textarea>
            <button class="submit-button-details" type="submit" >Save</button>
        </form>
        <div class="subheader-font" id="register-subheader">Achievements</div>
        <form method="POST" action="/details">
            <input type="hidden" name="form_type" value="achievements">
            <textarea name="achievements" id="achievements" required></textarea>
            <button class="submit-button-details" type="submit" >Save</button>
        </form>
    </div>
    </div>
</main>
{% endblock %}
